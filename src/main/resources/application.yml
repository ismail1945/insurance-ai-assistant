spring:
  application:
    name: policy-claims-copilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurance_assistant}
    username: ${DB_USERNAME:insurance}
    password: ${DB_PASSWORD:insurance}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin123}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      endpoint: ${OPENAI_ENDPOINT:https://api.openai.com/v1/chat/completions}
