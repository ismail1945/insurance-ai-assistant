spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurance_copilot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level logger=%logger{36} traceId=%X{traceId:-na} msg=%msg%n"

app:
  openai:
    enabled: ${OPENAI_ENABLED:true}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    api-key: ${OPENAI_API_KEY:}
    endpoint: ${OPENAI_ENDPOINT:https://api.openai.com/v1/chat/completions}
  ai:
    fallback-enabled: ${AI_FALLBACK_ENABLED:true}
  rag:
    top-k: ${RAG_TOP_K:4}
